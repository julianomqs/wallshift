[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallshift"
version = "0.1.0"
description = "Trocador minimalista de papel de parede para KDE Plasma, usando o Windows Spotlight como fonte de imagens."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.scripts]
wallshift = "wallshift.main:main"
wallshift-tray = "wallshift.tray:main"

[tool.hatch.build.targets.wheel]
packages = ["wallshift"]
